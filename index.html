<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Fill Exercise</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Form Fill Exercise</h1>

    <label>First Name</label>
<input type="text" id="firstName">
<p id="firstNameError" class="error"></p>

<label>Last Name</label>
<input type="text" id="lastName">
<p id="lastNameError" class="error"></p>

<label>Gender</label>
<select id="gender">
  <option value="">Select Gender</option>
  <option value="Male">Male</option>
  <option value="Female">Female</option>
</select>
<p id="genderError" class="error"></p>

    <button id="saveBtn" disabled>
      Save
    </button>
    <p>Live Users: <span id="userCount">0</span></p>
    <p id="duplicateMsg"></p>
    <input type="text" id="searchInput" placeholder="Search users">
    <div>
        <button class="filterGender" data-gender="All">All</button>
        <button class="filterGender" data-gender="Male">Male</button>
        <button class="filterGender" data-gender="Female">Female</button>
    </div>
    <div>
        <button id="fnSort">First Name A-Z</button>
        <button id="lnSort">Last Name A-Z</button>
        
    </div>
    <div class="stats-container">

  <div class="stat-card">
    <h3>Total Users</h3>
    <p id="totalUsers">0</p>
  </div>

  <div class="stat-card">
    <h3>Male</h3>
    <p id="maleUsers">0</p>
  </div>

  <div class="stat-card">
    <h3>Female</h3>
    <p id="femaleUsers">0</p>
  </div>

</div>

    


    <h2>Saved Users</h2>

    <table>
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Gender</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="userTable">

      </tbody>
    </table>
    
    <button id="clearBtn">Clear</button>
    

  </div>
  <div id="pag"></div>
  <p id="pageNb"></p>

  <script src="Form.js"></script>

</body>
</html>
