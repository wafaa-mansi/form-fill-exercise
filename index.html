<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Fill Exercise</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="container">

    <h1>Form Fill Exercise</h1>

    <div class="form-group">
      <label>First Name</label>
      <input
        type="text"
        id="firstName"
        placeholder="Enter first name"
      >
    </div>

    <div class="form-group">
      <label>Last Name</label>
      <input
        type="text"
        id="lastName"
        placeholder="Enter last name"
      >
    </div>

    <div class="form-group">
      <label>Gender</label>

      <select id="gender">
        <option value="">Select gender...</option>
        <option value="Female">Female</option>
        <option value="Male">Male</option>
      </select>
    </div>

    <button id="saveBtn" disabled>
      Save
    </button>

    <h2>Saved Users</h2>

    <table>
      <thead>
        <tr>
          <th>First Name</th>
          <th>Last Name</th>
          <th>Gender</th>
          <th>Action</th>
        </tr>
      </thead>

      <tbody id="userTable">

      </tbody>
    </table>

  </div>

  <script src="Form.js"></script>

</body>
</html>
